name: publish-images
on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version/tag
        required: true
        default: 0.5.10-alpha.1

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: hermes-control-plane-api
            context: control-plane
          - name: hermes-control-plane-router-gateway
            context: router-gateway
          - name: hermes-control-plane-smart-router
            context: smart-router
          - name: hermes-control-plane-execution-broker
            context: execution-broker
          - name: hermes-control-plane-node-agent
            context: node-agent
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:${{ inputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:latest

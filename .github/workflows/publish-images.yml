name: Build and Publish Docker Images

on:
  push:
    branches: [main, 'dev/**']
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: "Optional pre-tag candidate image tag (for example 0.5.10-candidate.<sha>)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: hermes-control-plane-api
            context: ./control-plane
          - image: hermes-control-plane-credential-service
            context: ./credential-service
          - image: hermes-control-plane-router-gateway
            context: ./router-gateway
          - image: hermes-control-plane-smart-router
            context: ./smart-router
          - image: hermes-control-plane-execution-broker
            context: ./execution-broker
          - image: hermes-control-plane-kubernetes-broker
            context: ./kubernetes-broker
          - image: hermes-control-plane-node-agent
            context: ./node-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Validate manual candidate tag
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_tag != ''
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?-candidate\.[0-9a-f]{7,40}$ ]]; then
            echo "Invalid candidate tag: $CANDIDATE_TAG" >&2
            exit 1
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.candidate_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.candidate_tag != '' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

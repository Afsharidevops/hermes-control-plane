{{- if not .Values.secrets.existingSecret }}
{{- $secretName := printf "%s-secrets" (include "hermes.fullname" .) -}}
{{- $old := lookup "v1" "Secret" .Release.Namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
type: Opaque
data:
  control-admin-token: {{ if .Values.secrets.controlAdminToken }}{{ .Values.secrets.controlAdminToken | b64enc }}{{ else if and $old (index $old.data "control-admin-token") }}{{ index $old.data "control-admin-token" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  bot-service-token: {{ if .Values.secrets.botServiceToken }}{{ .Values.secrets.botServiceToken | b64enc }}{{ else if and $old (index $old.data "bot-service-token") }}{{ index $old.data "bot-service-token" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  approval-bot-token: {{ if .Values.secrets.approvalBotToken }}{{ .Values.secrets.approvalBotToken | b64enc }}{{ else if and $old (index $old.data "approval-bot-token") }}{{ index $old.data "approval-bot-token" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  approval-hmac-key: {{ if .Values.secrets.approvalHmacKey }}{{ .Values.secrets.approvalHmacKey | b64enc }}{{ else if and $old (index $old.data "approval-hmac-key") }}{{ index $old.data "approval-hmac-key" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  agent-task-hmac-key: {{ if .Values.secrets.agentTaskHmacKey }}{{ .Values.secrets.agentTaskHmacKey | b64enc }}{{ else if and $old (index $old.data "agent-task-hmac-key") }}{{ index $old.data "agent-task-hmac-key" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  credential-admin-token: {{ if .Values.secrets.credentialAdminToken }}{{ .Values.secrets.credentialAdminToken | b64enc }}{{ else if and $old (index $old.data "credential-admin-token") }}{{ index $old.data "credential-admin-token" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  credential-service-token: {{ if .Values.secrets.credentialServiceToken }}{{ .Values.secrets.credentialServiceToken | b64enc }}{{ else if and $old (index $old.data "credential-service-token") }}{{ index $old.data "credential-service-token" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  credential-master-key: {{ if .Values.secrets.credentialMasterKey }}{{ .Values.secrets.credentialMasterKey | b64enc }}{{ else if and $old (index $old.data "credential-master-key") }}{{ index $old.data "credential-master-key" }}{{ else }}{{ printf "%s=" (randAlphaNum 43) | b64enc }}{{ end }}
  kubernetes-broker-token: {{ if .Values.secrets.kubernetesBrokerToken }}{{ .Values.secrets.kubernetesBrokerToken | b64enc }}{{ else if and $old (index $old.data "kubernetes-broker-token") }}{{ index $old.data "kubernetes-broker-token" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  execution-hmac-key: {{ if .Values.secrets.executionHmacKey }}{{ .Values.secrets.executionHmacKey | b64enc }}{{ else if and $old (index $old.data "execution-hmac-key") }}{{ index $old.data "execution-hmac-key" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  router-gateway-admin-token: {{ if .Values.secrets.routerGatewayAdminToken }}{{ .Values.secrets.routerGatewayAdminToken | b64enc }}{{ else if and $old (index $old.data "router-gateway-admin-token") }}{{ index $old.data "router-gateway-admin-token" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  smart-router-hmac-secret: {{ if .Values.secrets.smartRouterHmacSecret }}{{ .Values.secrets.smartRouterHmacSecret | b64enc }}{{ else if and $old (index $old.data "smart-router-hmac-secret") }}{{ index $old.data "smart-router-hmac-secret" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  smart-router-client-api-key: {{ if .Values.secrets.smartRouterClientApiKey }}{{ .Values.secrets.smartRouterClientApiKey | b64enc }}{{ else if and $old (index $old.data "smart-router-client-api-key") }}{{ index $old.data "smart-router-client-api-key" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  smart-router-admin-api-key: {{ if .Values.secrets.smartRouterAdminApiKey }}{{ .Values.secrets.smartRouterAdminApiKey | b64enc }}{{ else if and $old (index $old.data "smart-router-admin-api-key") }}{{ index $old.data "smart-router-admin-api-key" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  smart-router-bootstrap-admin-password: {{ if .Values.secrets.smartRouterBootstrapAdminPassword }}{{ .Values.secrets.smartRouterBootstrapAdminPassword | b64enc }}{{ else if and $old (index $old.data "smart-router-bootstrap-admin-password") }}{{ index $old.data "smart-router-bootstrap-admin-password" }}{{ else }}{{ randAlphaNum 28 | b64enc }}{{ end }}
  nine-router-initial-password: {{ if .Values.secrets.nineRouterInitialPassword }}{{ .Values.secrets.nineRouterInitialPassword | b64enc }}{{ else if and $old (index $old.data "nine-router-initial-password") }}{{ index $old.data "nine-router-initial-password" }}{{ else }}{{ randAlphaNum 28 | b64enc }}{{ end }}
  nine-router-jwt-secret: {{ if .Values.secrets.nineRouterJwtSecret }}{{ .Values.secrets.nineRouterJwtSecret | b64enc }}{{ else if and $old (index $old.data "nine-router-jwt-secret") }}{{ index $old.data "nine-router-jwt-secret" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  nine-router-api-key-secret: {{ if .Values.secrets.nineRouterApiKeySecret }}{{ .Values.secrets.nineRouterApiKeySecret | b64enc }}{{ else if and $old (index $old.data "nine-router-api-key-secret") }}{{ index $old.data "nine-router-api-key-secret" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  nine-router-machine-id-salt: {{ if .Values.secrets.nineRouterMachineIdSalt }}{{ .Values.secrets.nineRouterMachineIdSalt | b64enc }}{{ else if and $old (index $old.data "nine-router-machine-id-salt") }}{{ index $old.data "nine-router-machine-id-salt" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  omniroute-initial-password: {{ if .Values.secrets.omnirouteInitialPassword }}{{ .Values.secrets.omnirouteInitialPassword | b64enc }}{{ else if and $old (index $old.data "omniroute-initial-password") }}{{ index $old.data "omniroute-initial-password" }}{{ else }}{{ randAlphaNum 28 | b64enc }}{{ end }}
  omniroute-jwt-secret: {{ if .Values.secrets.omnirouteJwtSecret }}{{ .Values.secrets.omnirouteJwtSecret | b64enc }}{{ else if and $old (index $old.data "omniroute-jwt-secret") }}{{ index $old.data "omniroute-jwt-secret" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  omniroute-api-key-secret: {{ if .Values.secrets.omnirouteApiKeySecret }}{{ .Values.secrets.omnirouteApiKeySecret | b64enc }}{{ else if and $old (index $old.data "omniroute-api-key-secret") }}{{ index $old.data "omniroute-api-key-secret" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  omniroute-management-api-key: {{ if .Values.secrets.omnirouteManagementApiKey }}{{ .Values.secrets.omnirouteManagementApiKey | b64enc }}{{ else if and $old (index $old.data "omniroute-management-api-key") }}{{ index $old.data "omniroute-management-api-key" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  omniroute-storage-encryption-key: {{ if .Values.secrets.omnirouteStorageEncryptionKey }}{{ .Values.secrets.omnirouteStorageEncryptionKey | b64enc }}{{ else if and $old (index $old.data "omniroute-storage-encryption-key") }}{{ index $old.data "omniroute-storage-encryption-key" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  omniroute-machine-id-salt: {{ if .Values.secrets.omnirouteMachineIdSalt }}{{ .Values.secrets.omnirouteMachineIdSalt | b64enc }}{{ else if and $old (index $old.data "omniroute-machine-id-salt") }}{{ index $old.data "omniroute-machine-id-salt" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
  omniroute-ws-bridge-secret: {{ if .Values.secrets.omnirouteWsBridgeSecret }}{{ .Values.secrets.omnirouteWsBridgeSecret | b64enc }}{{ else if and $old (index $old.data "omniroute-ws-bridge-secret") }}{{ index $old.data "omniroute-ws-bridge-secret" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
{{- end }}

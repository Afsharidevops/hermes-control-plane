name: hermes-control-plane

services:
  nine-router:
    profiles: ["nine-router"]
    image: ${NINEROUTER_IMAGE_REPOSITORY:-decolua/9router}:${NINEROUTER_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${NINEROUTER_BIND_IP:-127.0.0.1}:${NINEROUTER_PORT:-20128}:20128"
    volumes:
      - nine-router-data:/app/data
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      JWT_SECRET: ${NINEROUTER_JWT_SECRET}
      INITIAL_PASSWORD: ${NINEROUTER_INITIAL_PASSWORD}
      API_KEY_SECRET: ${NINEROUTER_API_KEY_SECRET}
      MACHINE_ID_SALT: ${NINEROUTER_MACHINE_ID_SALT}
      REQUIRE_API_KEY: ${NINEROUTER_REQUIRE_API_KEY:-false}
      AUTH_COOKIE_SECURE: ${NINEROUTER_AUTH_COOKIE_SECURE:-false}
      ENABLE_REQUEST_LOGS: "false"
      OBSERVABILITY_ENABLED: "true"
      BASE_URL: http://nine-router:20128
      NEXT_PUBLIC_BASE_URL: ${NINEROUTER_PUBLIC_BASE_URL:-http://localhost:20128}
    networks: [router-net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20128').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  omniroute:
    profiles: ["omniroute"]
    image: ${OMNIROUTE_IMAGE_REPOSITORY:-diegosouzapw/omniroute}:${OMNIROUTE_IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "${OMNIROUTE_BIND_IP:-127.0.0.1}:${OMNIROUTE_PORT:-20228}:20128"
      - "${OMNIROUTE_API_BIND_IP:-127.0.0.1}:${OMNIROUTE_API_PORT:-20229}:20129"
    volumes:
      - omniroute-data:/app/data
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      DASHBOARD_PORT: "20128"
      API_PORT: "20129"
      API_HOST: "0.0.0.0"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      JWT_SECRET: ${OMNIROUTE_JWT_SECRET}
      INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD}
      API_KEY_SECRET: ${OMNIROUTE_API_KEY_SECRET}
      OMNIROUTE_API_KEY: ${OMNIROUTE_MANAGEMENT_API_KEY}
      STORAGE_ENCRYPTION_KEY: ${OMNIROUTE_STORAGE_ENCRYPTION_KEY}
      STORAGE_ENCRYPTION_KEY_VERSION: ${OMNIROUTE_STORAGE_ENCRYPTION_KEY_VERSION:-v1}
      MACHINE_ID_SALT: ${OMNIROUTE_MACHINE_ID_SALT}
      OMNIROUTE_WS_BRIDGE_SECRET: ${OMNIROUTE_WS_BRIDGE_SECRET}
      REQUIRE_API_KEY: ${OMNIROUTE_REQUIRE_API_KEY:-false}
      AUTH_COOKIE_SECURE: ${OMNIROUTE_AUTH_COOKIE_SECURE:-false}
      NEXT_PUBLIC_BASE_URL: ${OMNIROUTE_PUBLIC_BASE_URL:-http://localhost:20228}
      BASE_URL: http://omniroute:20128
      ALLOW_API_KEY_REVEAL: ${OMNIROUTE_ALLOW_API_KEY_REVEAL:-false}
      OMNIROUTE_MEMORY_MB: ${OMNIROUTE_MEMORY_MB:-512}
    networks: [router-net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20128/api/monitoring/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  router-gateway:
    image: ${IMAGE_NAMESPACE:-afsharidevops}/hermes-control-plane-router-gateway:${VERSION:-0.5.11}
    build:
      context: ./router-gateway
    restart: unless-stopped
    ports:
      - "${ROUTER_GATEWAY_BIND_IP:-127.0.0.1}:${ROUTER_GATEWAY_PORT:-8790}:8090"
    environment:
      HERMES_ROUTER_PROVIDER: ${HERMES_ROUTER_PROVIDER:-nine-router}
      ROUTER_GATEWAY_ADMIN_TOKEN: ${ROUTER_GATEWAY_ADMIN_TOKEN}
      NINE_ROUTER_BASE_URL: http://nine-router:20128/v1
      NINE_ROUTER_HEALTH_URL: http://nine-router:20128/api/health
      NINE_ROUTER_API_KEY: ${NINE_ROUTER_UPSTREAM_API_KEY:-}
      OMNIROUTE_BASE_URL: http://omniroute:20129/v1
      OMNIROUTE_HEALTH_URL: http://omniroute:20128/api/monitoring/health
      OMNIROUTE_UPSTREAM_API_KEY: ${OMNIROUTE_UPSTREAM_API_KEY:-}
    volumes:
      - router-gateway-data:/data
    networks: [router-net, app-net]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  smart-router-init:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data && chown 10001:10001 /data && chmod 0700 /data"]
    volumes:
      - smart-router-data:/data
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    security_opt: ["no-new-privileges:true"]
    networks: [app-net]

  smart-router:
    image: ${IMAGE_NAMESPACE:-afsharidevops}/hermes-control-plane-smart-router:${VERSION:-0.5.11}
    build:
      context: ./smart-router
    restart: unless-stopped
    ports:
      - "${SMART_ROUTER_BIND_IP:-127.0.0.1}:${SMART_ROUTER_PORT:-8787}:8080"
    environment:
      SMART_ROUTER_DASHBOARD_ENABLED: "true"
      SMART_ROUTER_CONTROL_PLANE_ENABLED: "true"
      SMART_ROUTER_CONTROL_DATABASE_URL: sqlite:////data/control.sqlite3
      SMART_ROUTER_DATABASE_PATH: /data/router.sqlite3
      SMART_ROUTER_COST_DATABASE_PATH: /data/cost-ledger.sqlite3
      SMART_ROUTER_MODE: ${SMART_ROUTER_MODE:-observe}
      SMART_ROUTER_POLICY: ${SMART_ROUTER_POLICY:-heuristic}
      SMART_ROUTER_HMAC_SECRET: ${SMART_ROUTER_HMAC_SECRET}
      SMART_ROUTER_CLIENT_API_KEY: ${SMART_ROUTER_CLIENT_API_KEY}
      SMART_ROUTER_ADMIN_API_KEY: ${SMART_ROUTER_ADMIN_API_KEY}
      SMART_ROUTER_BOOTSTRAP_ADMIN_USER: ${SMART_ROUTER_BOOTSTRAP_ADMIN_USER:-admin}
      SMART_ROUTER_BOOTSTRAP_ADMIN_PASSWORD: ${SMART_ROUTER_BOOTSTRAP_ADMIN_PASSWORD}
      SMART_ROUTER_REQUIRE_AUTH: "true"
      SMART_ROUTER_UPSTREAM_BASE_URL: http://router-gateway:8090/v1
      SMART_ROUTER_UPSTREAM_HEALTH_URL: http://router-gateway:8090/health
      SMART_ROUTER_UPSTREAM_API_KEY: ""
      SMART_ROUTER_PROVIDER_HEALTH_ENABLED: "true"
      SMART_ROUTER_OBSERVE_MODEL: ${SMART_ROUTER_OBSERVE_MODEL:-hermes/observe}
      SMART_ROUTER_FAST_MODEL: ${SMART_ROUTER_FAST_MODEL:-hermes/fast}
      SMART_ROUTER_STANDARD_MODEL: ${SMART_ROUTER_STANDARD_MODEL:-hermes/standard}
      SMART_ROUTER_STRONG_MODEL: ${SMART_ROUTER_STRONG_MODEL:-hermes/strong}
      SMART_ROUTER_CODING_MODEL: ${SMART_ROUTER_CODING_MODEL:-hermes/coding}
      SMART_ROUTER_VISION_MODEL: ${SMART_ROUTER_VISION_MODEL:-hermes/vision}
      SMART_ROUTER_FAST_SUPPORTS_TOOLS: "false"
      SMART_ROUTER_FAST_SUPPORTS_VISION: "false"
      SMART_ROUTER_STANDARD_SUPPORTS_TOOLS: "true"
      SMART_ROUTER_STANDARD_SUPPORTS_VISION: "false"
      SMART_ROUTER_STRONG_SUPPORTS_TOOLS: "true"
      SMART_ROUTER_STRONG_SUPPORTS_VISION: "true"
      SMART_ROUTER_POLICY_VERSION: "4"
    volumes:
      - smart-router-data:/data
      - ./smart-router/policy:/policy:ro
    depends_on:
      smart-router-init:
        condition: service_completed_successfully
      router-gateway:
        condition: service_healthy
    networks: [app-net]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]


  kubernetes-broker:
    image: ${IMAGE_NAMESPACE:-afsharidevops}/hermes-control-plane-kubernetes-broker:${VERSION:-0.5.11}
    build:
      context: ./kubernetes-broker
      args:
        KUBECTL_V1_33: ${KUBECTL_V1_33:-v1.33.13}
        KUBECTL_V1_34: ${KUBECTL_V1_34:-v1.34.10}
        KUBECTL_V1_35: ${KUBECTL_V1_35:-v1.35.6}
        KUBECTL_V1_36: ${KUBECTL_V1_36:-v1.36.2}
        KUBECTL_BOOTSTRAP_MINOR: ${KUBECTL_BOOTSTRAP_MINOR:-1.34}
    restart: unless-stopped
    # Docker bind mounts preserve host ownership. Run the broker as the
    # local operator UID/GID so mode-0600 kubeconfigs remain private/readable.
    user: "${HERMES_KUBERNETES_BROKER_UID:-10023}:${HERMES_KUBERNETES_BROKER_GID:-10023}"
    ports:
      - "${KUBERNETES_BROKER_BIND_IP:-127.0.0.1}:${KUBERNETES_BROKER_PORT:-8830}:8830"
    environment:
      HERMES_KUBERNETES_BROKER_TOKEN: ${HERMES_KUBERNETES_BROKER_TOKEN}
      HERMES_EXECUTION_HMAC_KEY: ${HERMES_EXECUTION_HMAC_KEY}
      HERMES_KUBERNETES_EXECUTION_ENABLED: ${HERMES_KUBERNETES_EXECUTION_ENABLED:-false}
      HERMES_KUBERNETES_COMMAND_TIMEOUT: ${HERMES_KUBERNETES_COMMAND_TIMEOUT:-60}
      HERMES_KUBECONFIG_ROOT: /credentials/kubeconfigs
      HERMES_DYNAMIC_KUBECTL_ENABLED: ${HERMES_DYNAMIC_KUBECTL_ENABLED:-true}
      HERMES_KUBECTL_SELECTION_MODE: ${HERMES_KUBECTL_SELECTION_MODE:-exact-preferred}
      HERMES_KUBECTL_CACHE_TTL_SECONDS: ${HERMES_KUBECTL_CACHE_TTL_SECONDS:-10}
    volumes:
      - ./data/kubeconfigs:/credentials/kubeconfigs:ro
    networks: [app-net]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  control-plane:
    image: ${IMAGE_NAMESPACE:-afsharidevops}/hermes-control-plane-api:${VERSION:-0.5.11}
    build:
      context: ./control-plane
    restart: unless-stopped
    ports:
      - "${CONTROL_PLANE_BIND_IP:-127.0.0.1}:${CONTROL_PLANE_PORT:-8800}:8800"
    environment:
      HERMES_RUNTIME: docker
      HERMES_CONTROL_ADMIN_TOKEN: ${HERMES_CONTROL_ADMIN_TOKEN}
      HERMES_BOT_SERVICE_TOKEN: ${HERMES_BOT_SERVICE_TOKEN}
      HERMES_APPROVAL_BOT_TOKEN: ${HERMES_APPROVAL_BOT_TOKEN}
      HERMES_APPROVAL_HMAC_KEY: ${HERMES_APPROVAL_HMAC_KEY}
      HERMES_AGENT_TASK_HMAC_KEY: ${HERMES_AGENT_TASK_HMAC_KEY}
      HERMES_CREDENTIAL_SERVICE_TOKEN: ${HERMES_CREDENTIAL_SERVICE_TOKEN}
      HERMES_CONTROL_DB: /data/control-plane.sqlite3
      HERMES_KUBERNETES_BROKER_URL: http://kubernetes-broker:8830
      HERMES_KUBERNETES_BROKER_TOKEN: ${HERMES_KUBERNETES_BROKER_TOKEN}
      HERMES_PROVIDER_WORKER_URL: http://node-agent:8810
      HERMES_PROVIDER_WORKER_TOKEN: ${HERMES_PROVIDER_WORKER_TOKEN}
      HERMES_PROVIDER_WORKER_TIMEOUT_SECONDS: ${HERMES_PROVIDER_COMMAND_TIMEOUT:-1800}
      HERMES_CAPACITY_WORKER_TIMEOUT_SECONDS: ${HERMES_CAPACITY_WORKER_TIMEOUT_SECONDS:-60}
      HERMES_VM_INVENTORY_WORKER_TIMEOUT_SECONDS: ${HERMES_VM_INVENTORY_WORKER_TIMEOUT_SECONDS:-60}
      HERMES_EXECUTION_HMAC_KEY: ${HERMES_EXECUTION_HMAC_KEY}
      HERMES_EXECUTION_ENABLED: ${HERMES_EXECUTION_ENABLED:-false}
      HERMES_ARTIFACT_SOURCE_ROOT: /data/artifact-source
      HERMES_ARTIFACT_MIRROR_ROOT: /data/artifact-mirror
      HERMES_ARTIFACT_HTTPS_HOST_ALLOWLIST: ${HERMES_ARTIFACT_HTTPS_HOST_ALLOWLIST:-}
      HERMES_ARTIFACT_AUTH_ROOT: /run/secrets/hermes-artifact-auth
      HERMES_ARTIFACT_HTTPS_AUTHFILE: ${HERMES_ARTIFACT_HTTPS_AUTHFILE:-}
      HERMES_ARTIFACT_REPOSITORY_KEYRING: ${HERMES_ARTIFACT_REPOSITORY_KEYRING:-}
      HERMES_ARTIFACT_OCI_SOURCE_REGISTRY_ALLOWLIST: ${HERMES_ARTIFACT_OCI_SOURCE_REGISTRY_ALLOWLIST:-}
      HERMES_ARTIFACT_OCI_DESTINATION_REGISTRY_ALLOWLIST: ${HERMES_ARTIFACT_OCI_DESTINATION_REGISTRY_ALLOWLIST:-}
      HERMES_ARTIFACT_OCI_SOURCE_AUTHFILE: ${HERMES_ARTIFACT_OCI_SOURCE_AUTHFILE:-}
      HERMES_ARTIFACT_OCI_DESTINATION_AUTHFILE: ${HERMES_ARTIFACT_OCI_DESTINATION_AUTHFILE:-}
      HERMES_ARTIFACT_MIRROR_MAX_BYTES: ${HERMES_ARTIFACT_MIRROR_MAX_BYTES:-536870912}
      HERMES_ARTIFACT_MIRROR_TIMEOUT_SECONDS: ${HERMES_ARTIFACT_MIRROR_TIMEOUT_SECONDS:-60}
      HERMES_ARTIFACT_REPOSITORY_MAX_EXPANDED_BYTES: ${HERMES_ARTIFACT_REPOSITORY_MAX_EXPANDED_BYTES:-4294967296}
      HERMES_ARTIFACT_REPOSITORY_METADATA_MAX_BYTES: ${HERMES_ARTIFACT_REPOSITORY_METADATA_MAX_BYTES:-268435456}
    volumes:
      - control-plane-data:/data
      - ${HERMES_ARTIFACT_AUTH_HOST_PATH:-./data/artifact-auth}:/run/secrets/hermes-artifact-auth:ro
    depends_on:
      kubernetes-broker:
        condition: service_healthy
      node-agent:
        condition: service_healthy
    networks: [app-net, credential-net]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  credential-service:
    image: ${IMAGE_NAMESPACE:-afsharidevops}/hermes-control-plane-credential-service:${VERSION:-0.5.11}
    build:
      context: ./credential-service
    restart: unless-stopped
    ports:
      - "${CREDENTIAL_SERVICE_BIND_IP:-127.0.0.1}:${CREDENTIAL_SERVICE_PORT:-8789}:8082"
    environment:
      HERMES_CREDENTIAL_ADMIN_TOKEN: ${HERMES_CREDENTIAL_ADMIN_TOKEN}
      HERMES_CREDENTIAL_SERVICE_TOKEN: ${HERMES_CREDENTIAL_SERVICE_TOKEN}
      HERMES_CREDENTIAL_MASTER_KEY: ${HERMES_CREDENTIAL_MASTER_KEY}
      HERMES_CREDENTIAL_MASTER_KEY_VERSION: ${HERMES_CREDENTIAL_MASTER_KEY_VERSION:-v1}
      HERMES_CREDENTIAL_DB: /data/credential-service.sqlite3
      HERMES_CONTROL_PLANE_URL: http://control-plane:8800
    volumes:
      - credential-service-data:/data
    depends_on:
      control-plane:
        condition: service_healthy
    networks: [credential-net]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  hermes:
    profiles: ["hermes"]
    image: ${HERMES_IMAGE_REPOSITORY:-nousresearch/hermes-agent}:${HERMES_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: gateway run
    shm_size: "1gb"
    ports:
      - "${HERMES_BIND_IP:-127.0.0.1}:${HERMES_API_PORT:-8642}:8642"
      - "${HERMES_BIND_IP:-127.0.0.1}:${HERMES_DASHBOARD_PORT:-9119}:9119"
    volumes:
      - hermes-data:/opt/data
      - ./plugins/stack-package-policy:/opt/data/plugins/stack-package-policy:ro
      - ./plugins/stack-execution-policy:/opt/data/plugins/stack-execution-policy:ro
      - ./plugins/control-plane-chatops:/opt/data/plugins/control-plane-chatops:ro
    environment:
      HERMES_HOME: /opt/data
      HERMES_DASHBOARD: ${HERMES_DASHBOARD:-0}
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      HERMES_DISABLE_LAZY_INSTALLS: "1"
      EXECUTION_FEATURES: ""
      # Hermes model traffic enters the internal Smart Router.
      OPENAI_BASE_URL: http://smart-router:8080/v1
      OPENAI_API_KEY: ${SMART_ROUTER_CLIENT_API_KEY}
      HERMES_MODEL: ${HERMES_MODEL:-auto}
      HERMES_CONTROL_PLANE_URL: http://control-plane:8800
      HERMES_BOT_SERVICE_TOKEN: ${HERMES_BOT_SERVICE_TOKEN}
      HERMES_CONTROL_PLANE_BOT_USERS: ${HERMES_CONTROL_PLANE_BOT_USERS:-}
      # Upstream Hermes gateway Telegram integration.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      # Helpful during beta plugin wiring; leave disabled unless diagnosing.
      HERMES_PLUGINS_DEBUG: ${HERMES_PLUGINS_DEBUG:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [app-net]

  node-agent:
    image: ${IMAGE_NAMESPACE:-afsharidevops}/hermes-control-plane-node-agent:${VERSION:-0.5.11}
    build:
      context: ./node-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:8810:8810"
    environment:
      HERMES_AGENT_NAME: local-docker-provider-worker
      HERMES_PROVIDER_WORKER_TOKEN: ${HERMES_PROVIDER_WORKER_TOKEN}
      HERMES_EXECUTION_HMAC_KEY: ${HERMES_EXECUTION_HMAC_KEY}
      HERMES_PROVIDER_EXECUTION_ENABLED: ${HERMES_PROVIDER_EXECUTION_ENABLED:-false}
      HERMES_PROVIDER_COMMAND_TIMEOUT: ${HERMES_PROVIDER_COMMAND_TIMEOUT:-1800}
      HERMES_PROVIDER_SSH_PROFILE_ROOT: /credentials/ssh
      HERMES_INFRASTRUCTURE_EXECUTION_ENABLED: ${HERMES_INFRASTRUCTURE_EXECUTION_ENABLED:-false}
      HERMES_INFRASTRUCTURE_CREDENTIAL_ROOT: /credentials/infrastructure
      HERMES_INFRASTRUCTURE_ALLOW_HTTP: ${HERMES_INFRASTRUCTURE_ALLOW_HTTP:-false}
      HERMES_INFRASTRUCTURE_REQUEST_TIMEOUT_SECONDS: ${HERMES_INFRASTRUCTURE_REQUEST_TIMEOUT_SECONDS:-20}
      HERMES_INFRASTRUCTURE_IPMI_TIMEOUT_SECONDS: ${HERMES_INFRASTRUCTURE_IPMI_TIMEOUT_SECONDS:-20}
      HERMES_INFRASTRUCTURE_VERIFY_ATTEMPTS: ${HERMES_INFRASTRUCTURE_VERIFY_ATTEMPTS:-5}
      HERMES_INFRASTRUCTURE_VERIFY_DELAY_SECONDS: ${HERMES_INFRASTRUCTURE_VERIFY_DELAY_SECONDS:-1}
      HERMES_INFRASTRUCTURE_FIRMWARE_VERIFY_ATTEMPTS: ${HERMES_INFRASTRUCTURE_FIRMWARE_VERIFY_ATTEMPTS:-60}
      HERMES_INFRASTRUCTURE_FIRMWARE_VERIFY_DELAY_SECONDS: ${HERMES_INFRASTRUCTURE_FIRMWARE_VERIFY_DELAY_SECONDS:-5}
      HERMES_INFRASTRUCTURE_PLATFORM_VERIFY_ATTEMPTS: ${HERMES_INFRASTRUCTURE_PLATFORM_VERIFY_ATTEMPTS:-90}
      HERMES_INFRASTRUCTURE_PLATFORM_VERIFY_DELAY_SECONDS: ${HERMES_INFRASTRUCTURE_PLATFORM_VERIFY_DELAY_SECONDS:-5}
      HERMES_CAPACITY_COLLECTION_ENABLED: ${HERMES_CAPACITY_COLLECTION_ENABLED:-false}
      HERMES_CAPACITY_REQUEST_TIMEOUT_SECONDS: ${HERMES_CAPACITY_REQUEST_TIMEOUT_SECONDS:-20}
      HERMES_CAPACITY_MAX_RESPONSE_BYTES: ${HERMES_CAPACITY_MAX_RESPONSE_BYTES:-1048576}
      HERMES_CAPACITY_MAX_REQUESTS: ${HERMES_CAPACITY_MAX_REQUESTS:-8}
      HERMES_VM_INVENTORY_COLLECTION_ENABLED: ${HERMES_VM_INVENTORY_COLLECTION_ENABLED:-false}
      HERMES_VM_INVENTORY_REQUEST_TIMEOUT_SECONDS: ${HERMES_VM_INVENTORY_REQUEST_TIMEOUT_SECONDS:-20}
      HERMES_VM_INVENTORY_MAX_RESPONSE_BYTES: ${HERMES_VM_INVENTORY_MAX_RESPONSE_BYTES:-1048576}
      HERMES_PROXMOX_VM_RUNTIME_ENABLED: ${HERMES_PROXMOX_VM_RUNTIME_ENABLED:-false}
      HERMES_PROXMOX_VM_REQUEST_TIMEOUT_SECONDS: ${HERMES_PROXMOX_VM_REQUEST_TIMEOUT_SECONDS:-20}
      HERMES_PROXMOX_VM_MAX_RESPONSE_BYTES: ${HERMES_PROXMOX_VM_MAX_RESPONSE_BYTES:-1048576}
      HERMES_PROXMOX_VM_MAX_REQUEST_BODY_BYTES: ${HERMES_PROXMOX_VM_MAX_REQUEST_BODY_BYTES:-8192}
      HERMES_PROXMOX_VM_MAX_REQUESTS_PER_EXECUTION: ${HERMES_PROXMOX_VM_MAX_REQUESTS_PER_EXECUTION:-32}
      HERMES_PROXMOX_VM_TASK_POLL_ATTEMPTS: ${HERMES_PROXMOX_VM_TASK_POLL_ATTEMPTS:-30}
      HERMES_PROXMOX_VM_TASK_POLL_DELAY_SECONDS: ${HERMES_PROXMOX_VM_TASK_POLL_DELAY_SECONDS:-2}
      HERMES_PROXMOX_VM_VERIFY_ATTEMPTS: ${HERMES_PROXMOX_VM_VERIFY_ATTEMPTS:-5}
      HERMES_PROXMOX_VM_VERIFY_DELAY_SECONDS: ${HERMES_PROXMOX_VM_VERIFY_DELAY_SECONDS:-1}
      HERMES_PROVIDER_WORK_ROOT: /var/lib/hermes-provider
      HERMES_ARTIFACT_MIRROR_ROOT: /data/artifact-mirror
      HERMES_PROVIDER_FILES_REPO_URL: ${HERMES_PROVIDER_FILES_REPO_URL:-}
      HERMES_PROVIDER_APT_REPO_URL: ${HERMES_PROVIDER_APT_REPO_URL:-}
      HERMES_PROVIDER_RPM_REPO_URL: ${HERMES_PROVIDER_RPM_REPO_URL:-}
      HERMES_PROVIDER_PYPI_URL: ${HERMES_PROVIDER_PYPI_URL:-}
    volumes:
      - control-plane-data:/data:ro
      - ${HERMES_PROVIDER_SSH_PROFILE_HOST_PATH:-./data/provider-ssh}:/credentials/ssh:ro
      - ${HERMES_INFRASTRUCTURE_CREDENTIAL_HOST_PATH:-./data/infrastructure-credentials}:/credentials/infrastructure:ro
      - provider-worker-data:/var/lib/hermes-provider
    networks: [app-net]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8810/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  app-net:
    driver: bridge
  router-net:
    driver: bridge
  credential-net:
    driver: bridge
    internal: true

volumes:
  nine-router-data:
  omniroute-data:
  router-gateway-data:
  smart-router-data:
  control-plane-data:
  credential-service-data:
  hermes-data:
  provider-worker-data:

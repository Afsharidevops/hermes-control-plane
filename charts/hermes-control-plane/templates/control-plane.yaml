{{- if .Values.controlPlane.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hermes.fullname" . }}-control-plane
  labels: {{- include "hermes.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: control-plane
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: control-plane
          image: "{{ .Values.imageNamespace }}/hermes-control-plane-api:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports: [{name: http, containerPort: 8800}]
          env:
            - {name: HERMES_RUNTIME, value: kubernetes}
            - name: HERMES_CONTROL_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "hermes.secretName" . }}, key: control-admin-token}}
            - name: HERMES_BOT_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "hermes.secretName" . }}, key: bot-service-token}}
            - name: HERMES_APPROVAL_BOT_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "hermes.secretName" . }}, key: approval-bot-token}}
            - name: HERMES_APPROVAL_HMAC_KEY
              valueFrom: {secretKeyRef: {name: {{ include "hermes.secretName" . }}, key: approval-hmac-key}}
            - name: HERMES_AGENT_TASK_HMAC_KEY
              valueFrom: {secretKeyRef: {name: {{ include "hermes.secretName" . }}, key: agent-task-hmac-key}}
            - name: HERMES_CREDENTIAL_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "hermes.secretName" . }}, key: credential-service-token}}
            - {name: HERMES_KUBERNETES_BROKER_URL, value: http://{{ include "hermes.fullname" . }}-kubernetes-broker:{{ .Values.kubernetesBroker.service.port }} }
            - name: HERMES_KUBERNETES_BROKER_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "hermes.secretName" . }}, key: kubernetes-broker-token}}
            - {name: HERMES_PROVIDER_WORKER_URL, value: http://{{ include "hermes.fullname" . }}-node-agent:{{ .Values.nodeAgent.service.port }} }
            - name: HERMES_PROVIDER_WORKER_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "hermes.secretName" . }}, key: provider-worker-token}}
            - {name: HERMES_PROVIDER_WORKER_TIMEOUT_SECONDS, value: {{ .Values.nodeAgent.commandTimeout | quote }}}
            - {name: HERMES_HOST_OBSERVER_URL, value: http://{{ include "hermes.fullname" . }}-host-observer:{{ .Values.hostObserver.service.port }} }
            - name: HERMES_HOST_OBSERVER_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "hermes.secretName" . }}, key: host-observer-token}}
            - name: HERMES_EXECUTION_HMAC_KEY
              valueFrom: {secretKeyRef: {name: {{ include "hermes.secretName" . }}, key: execution-hmac-key}}
            - {name: HERMES_EXECUTION_ENABLED, value: {{ .Values.controlPlane.executionEnabled | quote }}}
            - {name: HERMES_ARTIFACT_SOURCE_ROOT, value: /data/artifact-source}
            - {name: HERMES_ARTIFACT_MIRROR_ROOT, value: /data/artifact-mirror}
            - {name: HERMES_ARTIFACT_HTTPS_HOST_ALLOWLIST, value: {{ .Values.controlPlane.artifactMirror.httpsHostAllowlist | quote }}}
            - {name: HERMES_ARTIFACT_AUTH_ROOT, value: /run/secrets/hermes-artifact-auth}
            - {name: HERMES_ARTIFACT_HTTPS_AUTHFILE, value: {{ .Values.controlPlane.artifactMirror.httpsAuthFile | quote }}}
            - {name: HERMES_ARTIFACT_REPOSITORY_KEYRING, value: {{ .Values.controlPlane.artifactMirror.repositoryKeyringFile | quote }}}
            - {name: HERMES_ARTIFACT_OCI_SOURCE_REGISTRY_ALLOWLIST, value: {{ .Values.controlPlane.artifactMirror.ociSourceRegistryAllowlist | quote }}}
            - {name: HERMES_ARTIFACT_OCI_DESTINATION_REGISTRY_ALLOWLIST, value: {{ .Values.controlPlane.artifactMirror.ociDestinationRegistryAllowlist | quote }}}
            - {name: HERMES_ARTIFACT_OCI_SOURCE_AUTHFILE, value: {{ .Values.controlPlane.artifactMirror.ociSourceAuthFile | quote }}}
            - {name: HERMES_ARTIFACT_OCI_DESTINATION_AUTHFILE, value: {{ .Values.controlPlane.artifactMirror.ociDestinationAuthFile | quote }}}
            - {name: HERMES_ARTIFACT_MIRROR_MAX_BYTES, value: {{ .Values.controlPlane.artifactMirror.maxBytes | quote }}}
            - {name: HERMES_ARTIFACT_MIRROR_TIMEOUT_SECONDS, value: {{ .Values.controlPlane.artifactMirror.timeoutSeconds | quote }}}
            - {name: HERMES_ARTIFACT_REPOSITORY_MAX_EXPANDED_BYTES, value: {{ .Values.controlPlane.artifactMirror.repositoryMaxExpandedBytes | quote }}}
            - {name: HERMES_ARTIFACT_REPOSITORY_METADATA_MAX_BYTES, value: {{ .Values.controlPlane.artifactMirror.repositoryMetadataMaxBytes | quote }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data}
            {{ if .Values.controlPlane.artifactMirror.authSecretName }}
            - {name: artifact-auth, mountPath: /run/secrets/hermes-artifact-auth, readOnly: true}
            {{ end }}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 3, periodSeconds: 10}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "hermes.fullname" . }}-control-plane
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{ if .Values.controlPlane.artifactMirror.authSecretName }}
        - name: artifact-auth
          secret:
            secretName: {{ .Values.controlPlane.artifactMirror.authSecretName | quote }}
        {{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hermes.fullname" . }}-control-plane
spec:
  type: {{ .Values.controlPlane.service.type }}
  selector:
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports: [{name: http, port: {{ .Values.controlPlane.service.port }}, targetPort: http}]
{{- end }}

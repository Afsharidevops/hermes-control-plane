{{- if .Values.credentialService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hermes.fullname" . }}-credential-service
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
    app.kubernetes.io/component: credential-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: credential-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: credential-service
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: credential-service
          image: "{{ .Values.imageNamespace }}/hermes-control-plane-credential-service:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports: [{name: http, containerPort: 8082}]
          env:
            - name: HERMES_CREDENTIAL_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "hermes.secretName" . }}, key: credential-admin-token}}
            - name: HERMES_CREDENTIAL_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "hermes.secretName" . }}, key: credential-service-token}}
            - name: HERMES_CREDENTIAL_MASTER_KEY
              valueFrom: {secretKeyRef: {name: {{ include "hermes.secretName" . }}, key: credential-master-key}}
            - {name: HERMES_CREDENTIAL_MASTER_KEY_VERSION, value: {{ .Values.secrets.credentialMasterKeyVersion | quote }}}
            - {name: HERMES_CREDENTIAL_DB, value: /data/credential-service.sqlite3}
            - {name: HERMES_CONTROL_PLANE_URL, value: http://{{ include "hermes.fullname" . }}-control-plane:{{ .Values.controlPlane.service.port }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 3, periodSeconds: 10}
      volumes:
        - name: data
          {{- if .Values.credentialService.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "hermes.fullname" . }}-credential-service
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hermes.fullname" . }}-credential-service
spec:
  type: {{ .Values.credentialService.service.type }}
  selector:
    app.kubernetes.io/component: credential-service
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports: [{name: http, port: {{ .Values.credentialService.service.port }}, targetPort: http}]
{{- if .Values.credentialService.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hermes.fullname" . }}-credential-service
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.credentialService.persistence.size }}
  {{- if .Values.credentialService.persistence.storageClass }}
  storageClassName: {{ .Values.credentialService.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
{{- end }}

name: validate
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile Python services
        run: python -m compileall -q control-plane/src credential-service/src router-gateway/src node-agent/src kubernetes-broker/src execution-broker/src smart-router/src scripts/acceptance

      - name: Test Control Plane safety core
        run: |
          python -m venv /tmp/hermes-control-plane-tests
          /tmp/hermes-control-plane-tests/bin/python -m pip install --upgrade pip
          /tmp/hermes-control-plane-tests/bin/pip install -r control-plane/requirements-dev.txt
          PYTHONPATH=control-plane/src /tmp/hermes-control-plane-tests/bin/pytest -q control-plane/tests

      - name: Test Credential Service trust boundary
        run: |
          python -m venv /tmp/hermes-credential-service-tests
          /tmp/hermes-credential-service-tests/bin/python -m pip install --upgrade pip
          /tmp/hermes-credential-service-tests/bin/pip install -r credential-service/requirements-dev.txt
          PYTHONPATH=credential-service/src /tmp/hermes-credential-service-tests/bin/pytest -q credential-service/tests

      - name: Test Kubernetes Broker policy and execution boundaries
        run: |
          python -m venv /tmp/hermes-kubernetes-broker-tests
          /tmp/hermes-kubernetes-broker-tests/bin/python -m pip install --upgrade pip
          /tmp/hermes-kubernetes-broker-tests/bin/pip install -r kubernetes-broker/requirements-dev.txt
          PYTHONPATH=kubernetes-broker/src /tmp/hermes-kubernetes-broker-tests/bin/pytest -q kubernetes-broker/tests

      - name: Test Telegram approval one-time and expiry boundary
        run: PYTHONPATH=execution-broker/src /tmp/hermes-control-plane-tests/bin/pytest -q execution-broker/tests

      - name: Test Smart Router regression suite
        run: |
          python -m venv /tmp/hermes-smart-router-tests
          /tmp/hermes-smart-router-tests/bin/python -m pip install --upgrade pip
          /tmp/hermes-smart-router-tests/bin/pip install -r smart-router/requirements-dev.txt
          PYTHONPATH=smart-router/src /tmp/hermes-smart-router-tests/bin/pytest -q smart-router/tests
      - name: Test Node Agent infrastructure runtime
        run: |
          python -m venv /tmp/hermes-node-agent-tests
          /tmp/hermes-node-agent-tests/bin/python -m pip install --upgrade pip
          /tmp/hermes-node-agent-tests/bin/pip install -r node-agent/requirements-dev.txt
          PYTHONPATH=node-agent/src /tmp/hermes-node-agent-tests/bin/pytest -q node-agent/tests

      - name: Validate Compose and bot wiring
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME/0123456789abcdef0123456789abcdef0123456789abcdef/g' .env
          docker compose --env-file .env config >/dev/null
          python - <<'PY'
          from pathlib import Path
          compose = Path("docker-compose.yml").read_text()
          ctl = Path("hermesctl").read_text()
          required = [
              "./plugins/control-plane-chatops:/opt/data/plugins/control-plane-chatops:ro",
              "TELEGRAM_BOT_TOKEN:",
              "TELEGRAM_ALLOWED_USERS:",
              "OPENAI_BASE_URL: http://smart-router:8080/v1",
              "OPENAI_API_KEY: ${SMART_ROUTER_CLIENT_API_KEY}",
              "HERMES_MODEL:",
          ]
          for item in required:
              assert item in compose, item
          assert "plugins enable control-plane-chatops" in ctl
          assert "--entrypoint /opt/hermes/.venv/bin/hermes" in ctl
          assert "ensure_nine_router_api_key" in ctl
          assert "nine_router_key_http_status" in ctl
          assert "omniroute_key_http_status" in ctl
          assert "cmd_router_cleanup_keys" in ctl
          assert "ensure_omniroute_api_key" in ctl
          assert "omniroute_key_valid" in ctl
          assert "/api/auth/login" in ctl
          assert "/api/keys" in ctl
          assert "OMNIROUTE_UPSTREAM_API_KEY" in compose
          assert "HERMES_KUBERNETES_BROKER_UID" in compose
          print("bot/credential wiring: ok")
          PY

      - name: Source security checks
        run: |
          SECURITY_PY=/tmp/hermes-kubernetes-broker-tests/bin/python
          test -x "$SECURITY_PY"
          "$SECURITY_PY" -c 'import yaml; print("security gate PyYAML:", yaml.__version__)'
          case "$(cat VERSION)" in
            0.5.10)
              "$SECURITY_PY" scripts/acceptance/source-security-gate.py
              ;;
            0.5.11-dev.1)
              "$SECURITY_PY" scripts/acceptance/dev1-source-security-gate.py
              ;;
            0.5.11-dev.2)
              "$SECURITY_PY" scripts/acceptance/dev2-source-security-gate.py
              "$SECURITY_PY" scripts/acceptance/dev2-config-static-gate.py
              ;;
            0.5.11-dev.3)
              "$SECURITY_PY" scripts/acceptance/dev3-source-security-gate.py
              "$SECURITY_PY" scripts/acceptance/dev3-config-static-gate.py
              ;;
            0.5.11-dev.4)
              "$SECURITY_PY" scripts/acceptance/dev4-source-security-gate.py
              "$SECURITY_PY" scripts/acceptance/dev4-config-static-gate.py
              ;;
            0.5.11-dev.5)
              "$SECURITY_PY" scripts/acceptance/dev5-source-security-gate.py
              "$SECURITY_PY" scripts/acceptance/dev5-config-static-gate.py
              ;;
            *)
              echo "No source security gate configured for VERSION=$(cat VERSION)" >&2
              exit 1
              ;;
          esac

      - name: Helm lint
        run: |
          helm version --short
          helm lint charts/hermes-control-plane
